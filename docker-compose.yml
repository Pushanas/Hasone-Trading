# docker-compose.yml
# Multi-container orchestration for Hasone Trading (Database, Cache, and Full-Stack App)

version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hasone-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-hasone_admin}
      POSTGRES_PASSWORD: ${PGPASSWORD:-hasone_secure_password_2026}
      POSTGRES_DB: ${PGDATABASE:-hasone_trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-hasone_admin} -d ${PGDATABASE:-hasone_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hasone-network

  # 2. Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: hasone-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-hasone_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hasone-network

  # 3. Hasone Trading Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hasone-trading-engine
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY:-50afb2495f3e4384a3fea5960a7a202e}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${PGUSER:-hasone_admin}
      - DB_PASSWORD=${PGPASSWORD:-hasone_secure_password_2026}
      - DB_NAME=${PGDATABASE:-hasone_trading}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-hasone_redis_secret}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hasone-network

volumes:
  postgres_data:
  redis_data:

networks:
  hasone-network:
    driver: bridge
